# Builds Orikami every time something is pushed to the "main" branch:
#   - the web page (site/): the title video and a choice of download,
#     published to GitHub Pages (the game itself is not played in the browser);
#   - downloadable Windows and Mac versions, attached to a GitHub Release
#     called "latest" (the page links to them).
#
# One-time setup on GitHub: repository Settings > Pages > Source: "GitHub Actions".
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # also lets you press "Run workflow" by hand

permissions:
  contents: write   # to publish the "latest" release with the downloads
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Download Godot and its web export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          wget -q "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot"
          unzip -q "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates ./*.zip ./*.tpz

      - name: Import the project
        run: '"$RUNNER_TEMP/godot" --headless --path . --import'

      - name: Run the smoke test
        run: '"$RUNNER_TEMP/godot" --headless --path . --script tools/smoke_test.gd'

      - name: Make the web page (the download page in site/, not the game)
        run: |
          mkdir -p build/web
          cp site/index.html site/title_loop.mp4 site/title_backdrop.jpg site/yuji_syuku_ui.ttf build/web/
          test -f build/web/index.html

      - name: Export the Windows and Mac builds
        run: |
          mkdir -p build/windows build/mac
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Windows" build/windows/Orikami.exe
          "$RUNNER_TEMP/godot" --headless --path . --export-release "Mac" build/mac/Orikami.zip
          test -f build/windows/Orikami.exe
          test -f build/mac/Orikami.zip
          (cd build/windows && zip -q -r ../Orikami-Windows.zip .)
          cp build/mac/Orikami.zip build/Orikami-Mac.zip
          ls -la build

      - name: Publish the downloads (release "latest")
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/Orikami-Windows.zip build/Orikami-Mac.zip \
            --target "${{ github.sha }}" --latest \
            --title "Orikami (latest build)" \
            --notes "The newest build of Orikami, made automatically from the main branch. Windows: unzip and run Orikami.exe; the first time, if Windows says it protected your PC, click More info, then Run anyway. Mac: unzip, then the first time right-click Orikami and choose Open (macOS asks because the game is not signed by Apple)."

      - name: Set up Pages
        uses: actions/configure-pages@v6

      - name: Upload the web build
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
